# /etc/nginx/sites-available/zaytona  (link it into sites-enabled)
# nginx in front of the Go app: HTTPS (Let's Encrypt certificates from certbot,
# webroot method), one canonical host, body size cap, real client IP for the
# app's rate limits. Replace example.ma with the domain everywhere (sed in
# docs/DEPLOY_UBUNTU.md). The app runs with TRUST_PROXY=true and listens on
# 127.0.0.1:3000 behind the firewall.

# Access log without query strings: confirmation links carry a token (?t=...).
log_format zaytona '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent $request_time "$http_user_agent"';

upstream zaytona_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Port 80: Let's Encrypt challenges, everything else to https on the main host.
server {
    listen 80;
    listen [::]:80;
    server_name example.ma www.example.ma;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://example.ma$request_uri;
    }
}

# www to the main host.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.example.ma;

    ssl_certificate     /etc/letsencrypt/live/example.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ma/privkey.pem;
    include /etc/nginx/snippets/zaytona-tls.conf;

    return 301 https://example.ma$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.ma;

    ssl_certificate     /etc/letsencrypt/live/example.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ma/privkey.pem;
    include /etc/nginx/snippets/zaytona-tls.conf;

    access_log /var/log/nginx/zaytona.access.log zaytona;
    error_log  /var/log/nginx/zaytona.error.log warn;

    # Largest legitimate body: one photo (MAX_UPLOAD_MB=5) plus form fields.
    client_max_body_size 6m;
    client_body_timeout 30s;

    # The app sends its own security headers (CSP with nonces, HSTS, ...),
    # cache headers and precompressed assets: nginx only passes them on.
    location / {
        proxy_pass http://zaytona_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The app trusts only these (TRUST_PROXY=true): the client address as
        # nginx saw it, never a value the client sent.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
