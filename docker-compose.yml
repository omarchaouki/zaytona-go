# Local development. `docker compose up -d db` starts Postgres only.
# `docker compose --profile app up -d --build` also runs the production image locally.
services:
  db:
    image: postgres:16-alpine # same major as the reference; match production before cutover
    environment:
      POSTGRES_USER: olive
      POSTGRES_PASSWORD: olive
      POSTGRES_DB: olive
    ports:
      - "127.0.0.1:5432:5432" # loopback only, never exposed on the LAN
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olive -d olive"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://olive:olive@db:5432/olive
      APP_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    tmpfs:
      - /tmp
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
